name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6 bandit==1.8.0
      - run: ruff check .
      - run: ruff format --check .
      - run: bandit -q -r reference/app

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  detections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reference/requirements-dev.txt sigma-cli
      - name: sigma check
        run: sigma check detections/
      - name: demo
        working-directory: demo
        run: pytest -q
      - name: show alerts
        run: python demo/evaluate.py demo/sample_events.jsonl --min-level medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
